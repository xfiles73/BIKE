
name: Build Flutter Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - qwen-code-*

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: bikecontrol_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive   # needed if prop/ is a git submodule

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      # If the checkout above fails because "prop" was committed as an empty
      # (unresolved) submodule pointer, this step recreates it from prop_public
      # so that flutter pub get can find the package.
      - name: Ensure prop package exists (fallback)
        shell: pwsh
        run: |
          if (-not (Test-Path "prop/pubspec.yaml")) {
            Write-Host "prop/ missing or empty - copying from prop_public/"
            if (Test-Path "prop") { Remove-Item -Recurse -Force "prop" }
            Copy-Item -Recurse "prop_public" "prop"
          }

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: BIKE-Windows
          path: bikecontrol_test/build/windows/x64/runner/Release/
          if-no-files-found: error
